name: loadtest
# يدوي فقط: اختبار ضغط صغير على الصفحات العامة + معرفة خطة Workers في حساب خبير.
on: workflow_dispatch
jobs:
  load:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: حساب خبير في Cloudflare
        run: bash .github/scripts/cf-env.sh
      - name: plan
        run: |
          API=https://api.cloudflare.com/client/v4; H=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          curl -s "${H[@]}" "$API/accounts/$CF_ACCOUNT/subscriptions" | python3 -c "import sys,json;d=json.load(sys.stdin);print('::notice::subscriptions',d.get('success'),[(s.get('rate_plan',{}).get('id'),s.get('state')) for s in (d.get('result') or [])], d.get('errors'))"
          curl -s "${H[@]}" "$API/accounts/$CF_ACCOUNT/workers/account-settings" | python3 -c "import sys,json;d=json.load(sys.stdin);print('::notice::workers settings',d.get('success'),d.get('result'),d.get('errors'))"
      - name: load
        run: python3 .github/scripts/loadtest.py
