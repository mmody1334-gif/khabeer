name: deploy-site
# يبني موقع «خبير» وينشره على Cloudflare تلقائيًا عند أي تعديل في مجلد site/
on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/deploy-site.yml']
  workflow_dispatch:
concurrency: { group: deploy-site, cancel-in-progress: false }
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CF_SCRIPT: khabeer
      SITE: https://khabeer.khabeer-bio.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Fetch APKs from dist branch
        run: |
          git fetch origin dist --depth=1 2>/dev/null || true
          git show origin/dist:khabeer.apk > site/server/khabeer.apk 2>/dev/null || true
      - name: Build worker.js
        run: python3 site/server/build_worker.py
      - name: Check syntax
        run: cp site/dist/worker.js /tmp/w.mjs && node --check /tmp/w.mjs
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with: { name: worker-js, path: site/dist/worker.js, retention-days: 30 }
      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN secret is not set yet — built but not deployed."
            exit 0
          fi
          # الحساب وقاعدة D1 يُكتشفان تلقائيًّا من التوكن (تُنشأ قاعدة khabeer إن لم توجد)
          API=https://api.cloudflare.com/client/v4
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          # اختر الحساب الذي نطاق workers.dev له = khabeer-bio (لا نلمس حساب hudhaifa-bio أبدًا)
          ACC=""
          for a in $(curl -sS "$API/accounts?per_page=50" -H "$AUTH" | python3 -c "import sys,json;print(' '.join(x['id'] for x in json.load(sys.stdin)['result']))"); do
            sub=$(curl -sS "$API/accounts/$a/workers/subdomain" -H "$AUTH" | python3 -c "import sys,json;print((json.load(sys.stdin).get('result') or {}).get('subdomain',''))" || true)
            echo "account $a → subdomain '$sub'"
            [ "$sub" = "khabeer-bio" ] && ACC=$a
          done
          if [ -z "$ACC" ]; then
            echo "::error::لم أجد حسابًا نطاقه khabeer-bio بهذا التوكن — أنشئ التوكن من حساب khabeer-bio"; exit 1
          fi
          echo "CLOUDFLARE_ACCOUNT_ID=$ACC" >> $GITHUB_ENV; export CLOUDFLARE_ACCOUNT_ID=$ACC
          D1=$(curl -sS "$API/accounts/$ACC/d1/database?name=khabeer" -H "$AUTH" | python3 -c "import sys,json;r=[d['uuid'] for d in json.load(sys.stdin)['result'] if d['name']=='khabeer'];print(r[0] if r else '')")
          if [ -z "$D1" ]; then
            D1=$(curl -sS -X POST "$API/accounts/$ACC/d1/database" -H "$AUTH" -H "Content-Type: application/json" -d '{"name":"khabeer"}' | python3 -c "import sys,json;print(json.load(sys.stdin)['result']['uuid'])")
            echo "created D1 khabeer: $D1"
          fi
          sed -i "s/^database_id = .*/database_id = \"$D1\"/" site/wrangler.toml
          mkdir -p site/dist/assets/fin && cp -r site/finals/img/. site/dist/assets/fin/
          mkdir -p site/dist/assets/pdf && cp -r site/vendor/pdf/. site/dist/assets/pdf/
          mkdir -p site/dist/assets/promo && cp -r site/vendor/promo/. site/dist/assets/promo/
          # تنظيف صور الوزارة (خطوط الحواف، صناديق الدرجات، شظايا الورقة) — الأصول في site/finals تبقى كما هي
          pip install -q numpy pillow opencv-python-headless && python3 site/tools/clean_fin.py site/dist/assets/fin || echo "::warning::fin image cleaning skipped"
          # رقم السؤال الأصلي المطبوع في صورة سؤال الاختبار النهائي («٦)») — المنصة تكتب الرقم الجديد فوقها
          pip install -q pillow && python3 site/tools/fin_qno.py site/dist/assets/fin || echo "::warning::fin question numbers skipped"
          # نسخة PNG لكل صورة WebP: ملف Word يضمِّنها (Word لا يقرأ WebP)
          pip install -q pillow && python3 site/tools/fin_png.py site/dist/assets/fin || echo "::warning::fin png twins skipped"
          cd site && npx --yes wrangler@3.114.0 deploy && cd ..
          curl -sS -X POST "$API/accounts/$ACC/workers/scripts/$CF_SCRIPT/subdomain" -H "$AUTH" -H "Content-Type: application/json" -d '{"enabled":true}' >/dev/null || true
          SUB=$(curl -sS "$API/accounts/$ACC/workers/subdomain" -H "$AUTH" | python3 -c "import sys,json;print((json.load(sys.stdin).get('result') or {}).get('subdomain',''))")
          echo "::notice::workers.dev subdomain = '$SUB'  →  https://$CF_SCRIPT.$SUB.workers.dev"
          [ -n "$SUB" ] && SITE=https://$CF_SCRIPT.$SUB.workers.dev
          want=$(git rev-parse --short HEAD)
          for i in $(seq 1 30); do
            v=$(curl -s "$SITE/version" || true); echo "$v"
            got=$(echo "$v" | python3 -c "import sys,json;d=json.load(sys.stdin);print(d.get('sha','') if d.get('packs') is True else 'nopacks')" 2>/dev/null || true)
            echo "live: $got  want: $want"; [ "$got" = "$want" ] && exit 0; sleep 10
          done
          echo "::error::live site does not show the new version"; exit 1
