name: dns-txt
# يُشغَّل يدويًا: يطبع اسم حساب Cloudflare المالك لـ khaber.site، ويضيف سجل TXT على الجذر
# (مثل google-site-verification=...) إن أُعطي. لا يحذف ولا يعدّل أي سجل موجود.
on:
  workflow_dispatch:
    inputs:
      value: { description: 'قيمة سجل TXT (اتركه فارغًا للفحص فقط)', required: false, default: '' }
jobs:
  txt:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      VALUE: ${{ inputs.value }}
    steps:
      - uses: actions/checkout@v4
      - name: حساب خبير في Cloudflare
        run: bash .github/scripts/cf-env.sh
      - name: zone + TXT
        run: |
          API=https://api.cloudflare.com/client/v4; H=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json")
          curl -s "${H[@]}" "$API/accounts/$CF_ACCOUNT" | python3 -c "import sys,json;r=json.load(sys.stdin).get('result') or {};print('::notice::account name:',r.get('name'))"
          Z=$(curl -s "${H[@]}" "$API/zones?name=khaber.site")
          ZID=$(echo "$Z" | python3 -c "import sys,json;r=json.load(sys.stdin).get('result') or [];print(r[0]['id'] if r else '')")
          echo "$Z" | python3 -c "import sys,json;r=json.load(sys.stdin).get('result') or [];[print('::notice::zone',z['name'],z['status'],'account:',z['account'].get('name')) for z in r] or print('::notice::zone not found with this token')"
          [ -n "$ZID" ] || exit 0
          curl -s "${H[@]}" "$API/zones/$ZID/dns_records?type=TXT" | python3 -c "import sys,json;[print('::notice::TXT',x['name'],x['content'][:80]) for x in json.load(sys.stdin).get('result') or []]"
          if [ -n "$VALUE" ]; then
            BODY=$(python3 -c "import json,os;print(json.dumps({'type':'TXT','name':'khaber.site','content':os.environ['VALUE'],'ttl':1}))")
            curl -s -X POST "${H[@]}" "$API/zones/$ZID/dns_records" --data "$BODY" | python3 -c "import sys,json;d=json.load(sys.stdin);print('::notice::added',d.get('success'),d.get('errors'))"
          fi
