plugins { id 'com.android.application' }

android {
    namespace 'om.tahdir.app'
    compileSdk 36
    defaultConfig {
        minSdk 24
        targetSdk 36
        versionCode = Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')
        versionName = '1.' + (System.getenv('GITHUB_RUN_NUMBER') ?: '0')
    }
    flavorDimensions = ["brand"]
    productFlavors {
        khabeer {
            dimension "brand"
            applicationId 'om.tahdir.app'
            buildConfigField 'String', 'SITE_URL', '"https://khabeer.khabeer-bio.workers.dev/"'
            buildConfigField 'String', 'APP_LABEL', '"خبير"'
            buildConfigField 'String', 'TOOL_URL', '"https://khabeer.khabeer-bio.workers.dev/tool/tahdir-noor.user.js"'
            buildConfigField 'String', 'TAB_COLOR', '"#2E2775"'
            buildConfigField 'String', 'TAB_ACTIVE', '"#4B40A9"'
        }
    }
    signingConfigs {
        release {
            storeFile file('tahdir.keystore')
            storePassword System.getenv('KEYSTORE_PASSWORD')
            keyAlias 'tahdir'
            keyPassword System.getenv('KEYSTORE_PASSWORD')
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        buildConfig true
    }
}
